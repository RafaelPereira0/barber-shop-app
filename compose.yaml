services:
  backend:
    container_name: backend-barber
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 3001:3001
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
  
  frontend:
    container_name: frontend-barber
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
